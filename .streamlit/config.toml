# Redacta AI — Streamlit theme & runtime config
# Neutral ink palette: the accent lives in the app's own CSS, not the theme,
# so widgets stay monochrome and the page reads like a product console.

[theme]
base = "dark"
primaryColor = "#ededf0"
backgroundColor = "#08080a"
secondaryBackgroundColor = "#0e0e11"
textColor = "#ececee"

[browser]
gatherUsageStats = false
